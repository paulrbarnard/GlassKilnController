# Arduino CLI sketch project file. Confirmed by compiling on real hardware.
#
# Arduino_RouterBridge and its transitive deps (Arduino_RPClite, MsgPack,
# DebugLog, ArxTypeTraits, ArxContainer) auto-resolve from this sketch's
# #include directives with no explicit entry needed — they're apparently
# bundled/pre-associated with the arduino:zephyr board package.
#
# Other libraries don't resolve that way: when this sketch drove servos,
# RoboServo had to be listed under `libraries:` here or the build couldn't
# find its header (profile-based builds only pull in what's declared). Any
# library this sketch gains in the future will likely need the same.
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
default_profile: default
