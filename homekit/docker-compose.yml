# Runs next to the App Lab app, not under it: HomeKit needs host networking
# for Bonjour/mDNS, and App Lab containers use a bridge network.
name: kiln-homekit
services:
  hap:
    build: .
    image: glass-kiln-homekit:latest
    network_mode: host
    restart: unless-stopped
    environment:
      APP_URL: http://127.0.0.1:7000
      HOST_IP: 192.168.0.74
      ACCESSORY_NAME: Kiln
      STATE_FILE: /state/accessory.state
      HAP_DEBUG: "1"             # log subscriptions and events; remove once notifications are confirmed
    volumes:
      - ./state:/state           # pairing keys; keep it to stay paired
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
