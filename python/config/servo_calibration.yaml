# Per-servo rest/press angles and default press dwell — see docs/hardware.md
# for the calibration procedure. Placeholder values; must be tuned against
# the physical overlay before any real press is trusted.
#
# Pushed to the sketch at startup via Bridge.call("calibrate_servo", ...)
# (main.py) so the mechanical setup lives in one place, not hardcoded twice.

enter:
  rest_deg: 90
  press_deg: 60
  press_ms: 150

up:
  rest_deg: 90
  press_deg: 60
  press_ms: 150

down:
  rest_deg: 90
  press_deg: 60
  press_ms: 150
