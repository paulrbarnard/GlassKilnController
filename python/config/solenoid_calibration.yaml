# Per-solenoid drive settings — see docs/hardware.md for tuning. Starting
# values; check them against the real build before trusting a press.
#
#   kick_ms    full-power pull-in time at the start of every press (0-500)
#   hold_duty  PWM duty (0-255) that holds the plunger in after the kick;
#              as low as still holds the button reliably, to keep the coil
#              cool on the 4s "hold" presses
#
# Bench test 2026-10-21 (ENTER solenoid, 12V, unmounted, no button load):
# kick 100 gives a good hard pull-in; a 4s hold held at duty 30 and dropped
# out at 20. 100 leaves margin for the button's spring; re-test once the
# solenoids are mounted over the real buttons.
#
# On the kiln 2026-10-22 (revised mount: plunger pushes the membrane dome
# 0.5 mm at the end of travel, 85A TPU finger), 6 UP presses of 300 ms
# each registered: duty 100 -> 4/6, 160 -> 3/6, 220 -> 6/6, 255 -> 6/6.
# The unloaded hold test above was misleading: a membrane dome needs most
# of the solenoid's force to stay closed long enough to register.
#
#   settle_ms       long presses (the 5 s holds) drop to long_hold_duty
#   long_hold_duty  after this long: once the dome has closed it needs much
#                   less force to stay closed, and 5 s at 240 heated the
#                   coil. Tested 2026-10-22 with 5 s ENTER holds at IdLE:
#                   120 and 80 held (StOP), 50 let the dome lift (seen as a
#                   short press). 100 leaves margin. Dropping after 200 ms
#                   (the same as a tap) also held.
#                   UP/DOWN long presses scroll a value (the GM LT waits
#                   ~2 s, then repeats faster and faster), which needs a
#                   steadier contact: at 100-190 the dome made and broke
#                   (random beeps, +1 only); 220 scrolled like full power
#                   (+41 in 7 s) once UP and DOWN were repositioned. Long
#                   holds at 220 still warm the coil, so keep them short.
#                   After the mount was twisted (same day), ENTER at 100
#                   lost contact part way through a 5 s hold, which acts
#                   as a plain ENTER (in Pro editing: save and move on);
#                   160 held and exited cleanly (StOP > IdLE).
#                   The next morning 160 failed again (a long ENTER acted as
#                   a tap), so ENTER also uses 220. The app now skips the
#                   long ENTER when the controller already shows IdLE.
#
# 2026-10-23: the DOWN solenoid burnt out. These are rated 5% duty in 60 s
# at 12 V (~3 s of full power a minute; power goes with duty squared), and
# repeated scroll holds at 220 were several times that. ENTER and UP got
# shorter fingers with 2 mm pads, set to press the dome ~0.5 mm at the end
# of travel. Tested with 60 s rests: ENTER's 5 s exit held at 60 (twice,
# StOP seen) and is set to 80 (~10% power). UP scrolling still only gave
# +1 at 60-120 and +9 at 160, so its finger needs to go a little deeper.
#
# Pushed to the sketch at startup via Bridge.call("configure_solenoid", ...)
# (main.py) so the drive settings live in one place, not hardcoded twice.

enter:
  kick_ms: 100
  hold_duty: 240
  settle_ms: 200
  long_hold_duty: 80

up:
  kick_ms: 100
  hold_duty: 240
  settle_ms: 200
  long_hold_duty: 220

down:
  kick_ms: 100
  hold_duty: 240
  settle_ms: 200
  long_hold_duty: 220
