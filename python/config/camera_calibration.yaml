# Camera ROI + per-digit boxes for reading the GM LT 7-segment display.
# See docs/hardware.md "Camera" calibration procedure and
# kiln/vision.py RealVision._load_calibration.
#
# Measured 2026-10-21 on Steffi from a 1632x1232 frame of "IdLE." (Pi
# Camera V2, upright, 105 mm from the display). Re-measure if the camera
# mount moves.
#
# roi is in frame pixels; digit_boxes are relative to roi, left to right.
# Digits are 186 px tall on a 160 px pitch and lean right by ~7 degrees
# (a vertical segment's bottom sits ~12 px left of its top), so each box is
# wider than an upright digit would need. Each box also takes in that
# digit's decimal point at its bottom right. roi stops above the faint
# reflections of the digits on the panel below the display (y ~800).
# The first character of IdLE lights the right-hand segments (b, c), so it
# reads as the 7-segment pattern for "1".

roi:
  x: 530
  y: 545
  w: 660
  h: 220

digit_boxes:
  - {x: 16, y: 14, w: 145, h: 192}
  - {x: 176, y: 14, w: 145, h: 192}
  - {x: 336, y: 14, w: 145, h: 192}
  - {x: 496, y: 14, w: 145, h: 192}

# Centre of each segment, and of the decimal point, relative to a digit
# box (the same in every box). Measured from the lit segments of "IdLE."
# (E gives a, d, e, f, g; d and 1 give b and c). Each is sampled as an
# 11x11 px square (sample_half: 5), well inside the ~23 px thick segments.
#   _a_
#  f   b
#   _g_
#  e   c
#   _d_  .dp
segment_points:
  a: [75, 12]
  b: [112, 52]
  c: [101, 144]
  d: [54, 174]
  e: [15, 144]
  f: [27, 52]
  g: [64, 93]
  dp: [127, 174]
sample_half: 5
# Red level (0-255) the brightest segment must reach for the display to
# count as on; below it the display reads as blank.
min_lit: 80
