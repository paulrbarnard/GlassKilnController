# app.yaml: Arduino App Lab manifest.
#
# Schema and the web_ui brick both confirmed by deploying to and running on
# real hardware (an Uno Q named "Steffi"), including a live REST round trip
# (GET with a path param and POST with a JSON body both work — the brick is
# FastAPI underneath) — not just documentation. `bricks:` is what actually
# makes `arduino.app_bricks.web_ui` importable in python/main.py; nothing
# else needs to declare it. No `ports:` entry needed — the brick's default
# port (7000) is handled internally and doesn't need to be listed here (the
# official brick examples omit it too).

name: Glass Kiln Controller
icon: 🔥

ports: []

bricks:
  - arduino:web_ui
